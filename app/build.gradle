plugins {
    id 'com.android.application'
}

android {
    namespace 'it.rpn15'
    compileSdk 34

    defaultConfig {
        applicationId "it.rpn15"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        fissa {
            storeFile file('rpn15.keystore')
            storePassword 'rpn15pass'
            keyAlias 'rpn15'
            keyPassword 'rpn15pass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fissa
        }
        release {
            signingConfig signingConfigs.fissa
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
